<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#092F6E">
<meta name="description" content="25 figurinhas coloridas de revisão teórica do CPC 28 - Propriedade para Investimento. Curso de Contabilidade Professor Moreira.">
<title>CPC 28 • 25 Figurinhas | Professor Moreira</title>
<style>
:root{--navy:#092F6E;--navy2:#071D43;--yellow:#FFCE24;--txt:#132C4D;--bg:#EAF2FC;--border:#C4D6EE}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(145deg,#eef5ff,#dbeafb 65%,#f8fbff);color:var(--txt);min-height:100dvh}
button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #FFB900;outline-offset:3px}
header{background:linear-gradient(112deg,var(--navy2),var(--navy));color:white;padding:13px 14px 14px;box-shadow:0 4px 16px #12336630}
.head-inner{max-width:940px;margin:auto;display:flex;gap:12px;align-items:center;justify-content:space-between}.brand b{display:block;font-size:clamp(14px,3.3vw,18px);color:var(--yellow);line-height:1.25;text-transform:uppercase}.brand strong{display:block;font-size:clamp(17px,3.7vw,22px);line-height:1.26;margin-top:4px}.pill{padding:8px 10px;border-radius:20px;background:#ffffff18;border:1px solid #fff4;font-size:13px;font-weight:800;white-space:nowrap}
main{max-width:940px;margin:0 auto;padding:14px 12px 115px}.topline{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:0 auto 11px;max-width:700px}.topline h1{font-size:clamp(15px,3.5vw,19px);margin:0}.counter{background:var(--yellow);padding:7px 11px;border-radius:22px;color:#14284c;font-size:14px;font-weight:900;white-space:nowrap}
.progress{height:9px;background:#c6daef;border-radius:10px;overflow:hidden;max-width:700px;margin:0 auto 12px}.fill{height:100%;width:4%;background:linear-gradient(90deg,#06a96c,#fbc12a);border-radius:10px;transition:width .18s}
.poster{max-width:700px;margin:0 auto;display:flex;align-items:center;justify-content:center;min-height:250px}.poster img{display:block;width:100%;max-height:calc(100dvh - 295px);object-fit:contain;border-radius:18px;background:white;box-shadow:0 12px 35px #173d6930;border:1px solid #d4e3f4;cursor:zoom-in;touch-action:pan-y;user-select:none;-webkit-user-drag:none}
.caption{max-width:700px;text-align:center;margin:8px auto 0;font-size:13px;color:#536e8f}.toolbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;max-width:740px;margin:12px auto}.tool{background:white;border:1.5px solid var(--border);color:var(--navy);border-radius:13px;padding:10px 13px;font-weight:800;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:7px;box-shadow:0 2px 9px #19476a0c}.tool:hover{background:#f5faff}.tool.active{background:var(--yellow);border-color:#d5a200}
.controls{position:fixed;bottom:0;left:0;right:0;z-index:15;background:linear-gradient(0deg,#e7f1ff,#f9fcff);border-top:1px solid #cbdced;box-shadow:0 -6px 24px #06356d1d;padding:10px max(12px,env(safe-area-inset-right)) calc(11px + env(safe-area-inset-bottom))}.control-inner{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:9px;max-width:700px;margin:auto}.controls button{border:0;border-radius:15px;padding:13px 8px;font-weight:900;min-height:48px;font-size:clamp(14px,3.5vw,17px)}.previous{color:#092f6e;background:#d4e6fb}.next{background:#09a268;color:white}.restart{background:var(--yellow);color:#1b2e4e}.controls button:disabled{filter:grayscale(1);opacity:.5;cursor:not-allowed}
.gallery{max-width:850px;margin:0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.thumb{border:1px solid #c9d8ed;border-radius:17px;background:white;box-shadow:0 3px 12px #173d691c;padding:8px;text-align:left;cursor:pointer;color:var(--txt)}.thumb img{width:100%;border-radius:10px;display:block;aspect-ratio:4/5;object-fit:contain;background:#f5f8ff}.thumb span{display:block;font-size:12px;font-weight:800;line-height:1.25;margin:8px 3px 2px}.thumb small{font-size:11px;color:#61758d;margin:0 3px 3px;display:block}.thumb.seen{border-color:#31b27f}.thumb.sel{outline:3px solid #ffcc24}.hidden{display:none!important}.galleryhint{text-align:center;font-weight:800;font-size:16px;margin:4px 0 15px}
.zoom{position:fixed;z-index:50;inset:0;display:none;align-items:center;justify-content:center;background:#061326f0;padding:64px 12px 34px}.zoom.show{display:flex}.zoom img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}.zoom button{position:absolute;right:14px;top:13px;border:1px solid #fff6;color:white;background:#243d5b;border-radius:50%;width:46px;height:46px;font-size:29px;cursor:pointer}
@media(min-width:750px){.gallery{grid-template-columns:repeat(4,minmax(0,1fr))}.poster img{max-height:min(72dvh,950px)}}
@media(max-height:660px){main{padding-top:7px}.poster img{max-height:calc(100dvh - 255px)}.toolbar{margin:8px auto}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="head-inner"><div class="brand"><b>Curso de Contabilidade Professor Moreira</b><strong>Propriedade para Investimento • CPC 28</strong></div><div class="pill">TEORIA • FGV</div></div></header>
<main>
 <div class="topline"><h1 id="topic">25 figurinhas para estudar</h1><div class="counter" id="count" aria-live="polite">01 / 25</div></div>
 <div class="progress"><div class="fill" id="fill"></div></div>
 <section id="viewer"><div class="poster"><img id="card" alt="Figurinha 1, teoria de propriedade para investimento" src="imagens/figurinha_01.png" draggable="false"></div><p class="caption">Toque na figurinha para ampliar • Deslize para a esquerda ou direita</p></section>
 <section id="gallery" class="hidden"><div class="galleryhint">Escolha uma das 25 figurinhas</div><div class="gallery" id="grid"></div></section>
 <nav class="toolbar" aria-label="Ferramentas">
  <button type="button" class="tool" id="showGrid">▦ Ver todas</button>
  <button type="button" class="tool" id="fullscreen">⛶ Tela cheia</button>
  <a class="tool" id="download" href="imagens/figurinha_01.png" download="figurinha_01.png">↓ Salvar figurinha</a>
 </nav>
</main>
<nav class="controls"><div class="control-inner"><button type="button" class="previous" id="prev" aria-label="Voltar para a figurinha anterior">← Voltar</button><button type="button" class="restart" id="reset">↻ Reiniciar</button><button type="button" class="next" id="next" aria-label="Ir para a próxima figurinha">Avançar →</button></div></nav>
<div class="zoom" id="zoom" role="dialog" aria-modal="true" aria-label="Figurinha ampliada"><button type="button" id="closeZoom" aria-label="Fechar ampliação">×</button><img id="big" alt="Figurinha ampliada"></div>
<script>
'use strict';
const ITEMS=[{"file":"imagens/figurinha_01.png","title":"O QUE É PROPRIEDADE PARA INVESTIMENTO?","topic":"É um imóvel mantido para obter aluguel, valorização do capital ou ambos.","page":1},{"file":"imagens/figurinha_02.png","title":"QUAL É A FINALIDADE?","topic":"Gerar RENDA de aluguel ou VALORIZAÇÃO do capital.","page":1},{"file":"imagens/figurinha_03.png","title":"O QUE NÃO É PPI?","topic":"Imóvel usado na operação ou destinado à venda habitual NÃO é PPI.","page":1},{"file":"imagens/figurinha_04.png","title":"CLASSIFICAÇÃO NO BALANÇO","topic":"ATIVO NÃO CIRCULANTE → INVESTIMENTOS.","page":1},{"file":"imagens/figurinha_05.png","title":"EXEMPLO 1 — TERRENO","topic":"Terreno mantido para valorização do capital a longo prazo.","page":1},{"file":"imagens/figurinha_06.png","title":"EXEMPLO 2 — USO INDEFINIDO","topic":"Terreno cuja utilização futura ainda não foi determinada.","page":1},{"file":"imagens/figurinha_07.png","title":"EXEMPLO 3 — PRÉDIO ALUGADO","topic":"Edifício da entidade alugado a terceiros por arrendamento operacional.","page":1},{"file":"imagens/figurinha_08.png","title":"EXEMPLO 4 — PRÉDIO VAZIO","topic":"Edifício desocupado, mas mantido para futura locação.","page":1},{"file":"imagens/figurinha_09.png","title":"EXEMPLO 5 — EM CONSTRUÇÃO","topic":"Imóvel em construção para ser usado futuramente como propriedade para investimento.","page":1},{"file":"imagens/figurinha_10.png","title":"SERVIÇOS AOS OCUPANTES","topic":"A relevância dos serviços prestados aos usuários do imóvel altera sua classificação.","page":2},{"file":"imagens/figurinha_11.png","title":"SERVIÇOS INSIGNIFICANTES","topic":"Serviços acessórios pouco relevantes: permanece como PPI.","page":2},{"file":"imagens/figurinha_12.png","title":"SERVIÇOS SIGNIFICATIVOS","topic":"Serviços essenciais e relevantes: a propriedade é IMOBILIZADO.","page":2},{"file":"imagens/figurinha_13.png","title":"MENSURAÇÃO: DUAS ETAPAS","topic":"Primeiro, a entidade reconhece pelo CUSTO. Depois, escolhe o modelo subsequente.","page":3},{"file":"imagens/figurinha_14.png","title":"MENSURAÇÃO INICIAL","topic":"Propriedade para investimento é inicialmente mensurada pelo CUSTO.","page":3},{"file":"imagens/figurinha_15.png","title":"MENSURAÇÃO SUBSEQUENTE","topic":"A entidade pode escolher VALOR JUSTO ou CUSTO.","page":3},{"file":"imagens/figurinha_16.png","title":"MÉTODO DO VALOR JUSTO","topic":"Ganhos e perdas de valor justo são reconhecidos no RESULTADO.","page":4},{"file":"imagens/figurinha_17.png","title":"MÉTODO DO CUSTO","topic":"Mantém a mensuração baseada no CUSTO e aplica depreciação quando cabível.","page":4},{"file":"imagens/figurinha_18.png","title":"ESTOQUE VIRA PPI","topic":"Mudou a finalidade: de venda habitual para renda ou valorização.","page":2},{"file":"imagens/figurinha_19.png","title":"ESTOQUE → PPI: EFEITO","topic":"VALOR JUSTO MAIOR = RECEITA. MENOR = DESPESA.","page":2},{"file":"imagens/figurinha_20.png","title":"IMOBILIZADO VIRA PPI","topic":"Imóvel deixa de ser usado pela entidade e passa a gerar aluguel ou valorização.","page":2},{"file":"imagens/figurinha_21.png","title":"IMOBILIZADO → PPI: EFEITO","topic":"VALOR JUSTO MAIOR = AAP, NO PL. MENOR = DESPESA.","page":2},{"file":"imagens/figurinha_22.png","title":"PPI → IMOBILIZADO","topic":"O imóvel passa a ser utilizado nas atividades da própria entidade.","page":4},{"file":"imagens/figurinha_23.png","title":"PPI → ESTOQUE","topic":"O imóvel passa a integrar a venda no curso ordinário dos negócios.","page":4},{"file":"imagens/figurinha_24.png","title":"RESUMO DA MENSURAÇÃO","topic":"INICIAL: custo. DEPOIS: valor justo ou custo.","page":3},{"file":"imagens/figurinha_25.png","title":"REGRA DE OURO PARA A FGV","topic":"PPI = IMÓVEL PARA ALUGUEL OU VALORIZAÇÃO DO CAPITAL.","page":4}];
const STORAGE='moreira_cpc28_figurinhas_2026_v1';
const $=id=>document.getElementById(id);
let saved=0,seen=new Set();
try{const obj=JSON.parse(localStorage.getItem(STORAGE)||'{}');saved=Number.isInteger(obj.current)?Math.max(0,Math.min(ITEMS.length-1,obj.current)):0;seen=new Set((Array.isArray(obj.seen)?obj.seen:[]).filter(x=>Number.isInteger(x)&&x>=0&&x<ITEMS.length))}catch(e){}
let current=saved,gridMode=false;
function store(){try{localStorage.setItem(STORAGE,JSON.stringify({current,seen:[...seen]}))}catch(e){}}
function paint(){
  const item=ITEMS[current]; seen.add(current);store();
  $('topic').textContent=item.title;
  $('count').textContent=`${String(current+1).padStart(2,'0')} / ${ITEMS.length}`;
  $('fill').style.width=`${((current+1)/ITEMS.length)*100}%`;
  $('card').src=item.file;$('card').alt=`Figurinha ${current+1} de ${ITEMS.length}: ${item.title}`;
  $('download').href=item.file;$('download').download=item.file.split('/').pop();
  $('prev').disabled=current===0; $('next').disabled=current===ITEMS.length-1;
  for(const n of [current+1,current-1])if(n>=0&&n<ITEMS.length){const im=new Image();im.src=ITEMS[n].file}
  if(gridMode)renderGrid();
}
function go(n){current=Math.max(0,Math.min(ITEMS.length-1,n));gridMode=false;updateMode();paint();window.scrollTo({top:0,behavior:'instant'})}
function updateMode(){ $('viewer').classList.toggle('hidden',gridMode);$('gallery').classList.toggle('hidden',!gridMode);$('download').classList.toggle('hidden',gridMode);$('showGrid').textContent=gridMode?'▤ Ver figurinha':'▦ Ver todas';$('showGrid').classList.toggle('active',gridMode) }
function renderGrid(){const g=$('grid');g.innerHTML='';for(let i=0;i<ITEMS.length;i++){let b=document.createElement('button');b.className='thumb'+(seen.has(i)?' seen':'')+(i===current?' sel':'');b.type='button';let im=document.createElement('img');im.src=ITEMS[i].file;im.loading='lazy';im.alt=`Miniatura da figurinha ${i+1}`;let title=document.createElement('span');title.textContent=`${String(i+1).padStart(2,'0')}. ${ITEMS[i].title}`;let sub=document.createElement('small');sub.textContent=`Teoria do PDF • pág. ${ITEMS[i].page}`;b.append(im,title,sub);b.addEventListener('click',()=>go(i));g.appendChild(b)}}
$('prev').addEventListener('click',()=>go(current-1));$('next').addEventListener('click',()=>go(current+1));
$('reset').addEventListener('click',()=>{current=0;seen.clear();go(0)});
$('showGrid').addEventListener('click',()=>{gridMode=!gridMode;updateMode();if(gridMode)renderGrid();window.scrollTo({top:0,behavior:'instant'})});
$('fullscreen').addEventListener('click',()=>{if(document.fullscreenElement){document.exitFullscreen?.()}else{document.documentElement.requestFullscreen?.().catch(()=>{})}});
$('card').addEventListener('click',()=>{$('big').src=ITEMS[current].file;$('zoom').classList.add('show')});
function closeZoom(){$('zoom').classList.remove('show');$('big').removeAttribute('src')}
$('closeZoom').addEventListener('click',closeZoom);$('zoom').addEventListener('click',e=>{if(e.target===$('zoom'))closeZoom()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeZoom();if(e.key==='ArrowRight'&&!gridMode&& !$('zoom').classList.contains('show'))go(current+1);if(e.key==='ArrowLeft'&&!gridMode&& !$('zoom').classList.contains('show'))go(current-1)});
let touchX=0,touchY=0;$('card').addEventListener('touchstart',e=>{touchX=e.changedTouches[0].clientX;touchY=e.changedTouches[0].clientY},{passive:true});$('card').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchX,dy=e.changedTouches[0].clientY-touchY;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.4)go(current+(dx<0?1:-1))},{passive:true});
updateMode();paint();
</script>
</body></html>
